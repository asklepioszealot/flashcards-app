name: Release Android

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to tauri.conf.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable + aarch64-linux-android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Read version from tag (or tauri.conf.json)
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#android-v}"
          elif [[ -n "${{ github.event.inputs.version || '' }}" ]]; then
            version="${{ github.event.inputs.version }}"
            tag="android-v${version}"
          else
            version=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
            tag="android-v${version}"
          fi
          if [[ -z "$version" ]]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          GWC: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GAC: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_B64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$STORE_PW" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$KEY_PW" ]] && missing+=("ANDROID_KEY_PASSWORD")
          [[ -z "$SB_URL" ]] && missing+=("SUPABASE_URL")
          [[ -z "$SB_ANON" ]] && missing+=("SUPABASE_ANON_KEY")
          [[ -z "$GWC" ]] && missing+=("GOOGLE_WEB_CLIENT_ID")
          [[ -z "$GAC" ]] && missing+=("GOOGLE_ANDROID_CLIENT_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf 'Missing secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write key.properties
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=${RUNNER_TEMP}/release.jks
          storePassword=${STORE_PW}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PW}
          EOF

      - name: Write runtime-config.local.json
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          GWC: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GAC: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = {
            supabaseUrl: process.env.SB_URL,
            supabaseAnonKey: process.env.SB_ANON,
            googleWebClientId: process.env.GWC,
            googleAndroidClientId: process.env.GAC,
          };
          fs.writeFileSync('runtime-config.local.json', JSON.stringify(config, null, 2));
          NODE

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run build:android

      - name: Ensure release exists and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.app_version.outputs.tag }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          set -euo pipefail
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "APK not found at $APK" >&2
            ls -R src-tauri/gen/android/app/build/outputs || true
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Android v${VERSION}" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            "$APK#app-universal-release.apk" \
            --clobber
